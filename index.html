<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bin💗Tròn</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/hearts-bg.css">
<link rel="stylesheet" href="css/stars-bg.css">
<link rel="stylesheet" href="css/petals.css">
<link rel="stylesheet" href="css/memories.css">
<link rel="stylesheet" href="css/gift.css">
</head>
<body>

<div id="aurora" aria-hidden="true">
  <div class="orb orb--gold"></div>
  <div class="orb orb--rose"></div>
  <div class="orb orb--magenta"></div>
  <div class="orb orb--violet"></div>
  <div class="orb orb--blush"></div>
</div>

<div class="grain" aria-hidden="true"></div>

<button id="start-gate" class="start-gate" type="button">
  <span class="start-gate__text">Chạm để thấy điều bất ngờ 💗</span>
</button>

<div id="viewport">

  <canvas id="stars-canvas"></canvas>
  <canvas id="hearts-canvas"></canvas>

  <main id="stage" class="stage">
    <section class="scene" id="scene-intro"></section>
    <section class="scene" id="scene-memories"></section>
    <section class="scene" id="scene-gift"></section>
  </main>

  <audio id="bg-audio" loop preload="auto"></audio>

</div>

<script src="js/utils.js"></script>
<script src="js/config.js"></script>
<script src="js/heartsBackground.js"></script>
<script src="js/starsBackground.js"></script>
<script src="js/petals.js"></script>
<script src="js/audioPlayer.js"></script>
<script src="js/heartsWarp.js"></script>
<script src="js/sceneManager.js"></script>
<script src="js/scenes/intro.js"></script>
<script src="js/scenes/memories.js"></script>
<script src="js/scenes/gift.js"></script>
<script src="js/main.js"></script>
</body>
</html>
